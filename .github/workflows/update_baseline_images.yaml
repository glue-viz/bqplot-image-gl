name: Update Visual References

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: write
  pull-requests: write

jobs:
  update-visual-references:
    name: Update Visual References
    if: ${{ github.event.issue.pull_request && contains(github.event.comment.body, 'update baseline') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Checkout the branch from the PR that triggered the job
        run: gh pr checkout ${{ github.event.issue.number }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tox

      - name: Generate baseline images
        run: tox -e py311-visual -- --mpl-generate-path=tests/ui/baseline

      - name: Compress screenshots
        run: |
          sudo apt install optipng
          find tests/ui/baseline -name '*.png' -exec optipng {} +

      - name: Commit reference images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git pull

          git add tests/ui/baseline

          git commit -m "chore: Update visual references"
          git push
